<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Clone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Style.css">
</head>
<body>
<main>
  <!-- HEADER -->
  <header class="top">
    <div class="first">
      <div id="logo" aria-label="Logo">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24zm5.5 17.3a.75.75 0 0 1-1 .25c-2.8-1.7-6.3-2.1-10.4-1.1a.75.75 0 1 1-.33-1.46c4.5-1 8.4-.6 11.5 1.3.35.2.47.66.23 1zm1.5-3.3a.94.94 0 0 1-1.3.3c-3.2-2-8.1-2.5-11.9-1.4a.94.94 0 0 1-.54-1.8c4.3-1.3 9.7-.7 13.4 1.6.44.28.58.86.3 1.3zm.13-3.4C15.3 8.3 9 8.1 5.4 9.2a1.12 1.12 0 1 1-.65-2.15c4.2-1.3 11.2-1 15.6 1.6a1.12 1.12 0 0 1-1.2 1.9z"/></svg>
      </div>
      <div class="search-box">
        <svg id="home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg>
        <input id="search" type="text" placeholder="What do you want to play?" autocomplete="off">
      </div>
    </div>
    <div class="buttons">
      <button class="Signup">Sign Up</button>
      <button class="login">Log In</button>
    </div>
  </header>

  <div class="cont">
    <!-- LIBRARY -->
    <aside class="left">
      <div class="library-header">
        <span class="library-title">Your Library</span>
        <button class="library-add" aria-label="Add">+</button>
      </div>
      <div class="songlist"><ul></ul></div>
      <div class="sidebar-footer">
        <span>Legal</span><span>Privacy</span><span>Cookies</span><span>About</span>
      </div>
    </aside>

    <!-- RIGHT -->
    <section class="right">
      <div class="content-area">
        <div class="section-heading">
          <p class="eyebrow">DISCOVER • YOUR MUSIC</p>
          <h1>Made for you</h1>
          <p class="section-subtitle">Find something you’ll love listening to.</p>
        </div>
        <div class="cards"></div>
      </div>

      <!-- PLAYER -->
      <div class="side">
        <div class="now-playing-label">NOW PLAYING</div>
        <div class="player-content">
          <div class="track">
            <div class="player-art"><div id="disc"></div></div>
            <div class="infos">
              <div class="songinfo">Select a track</div>
              <div class="songtime">00:00 / 00:00</div>
            </div>
          </div>

          <div class="seek-container">
            <div class="seekbar"><div class="circle"></div></div>
          </div>

          <div class="player-buttons">
            <button id="previous" class="control-btn" aria-label="Previous">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M19 5v14L8 12z"/><path d="M5 5v14" stroke-linecap="round"/></svg>
            </button>
            <button id="minus5sec" class="skip-btn">−5s</button>
            <button id="play" class="play" aria-label="Play/Pause"></button>
            <button id="plus5sec" class="skip-btn">+5s</button>
            <button id="next" class="control-btn" aria-label="Next">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 5v14l11-7z"/><path d="M19 5v14" stroke-linecap="round"/></svg>
            </button>
          </div>

          <div id="volume">
            <span>VOL</span>
            <input type="range" min="0" max="100" value="100" aria-label="Volume">
          </div>
        </div>
      </div>
    </section>
  </div>
</main>
<script src="Script.js"></script>
</body>
</html>
