<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spotify Clone - Faizan Saqib</title>

    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="Utility.css">
</head>

<body>

    <main>

        <!-- ================= HEADER ================= -->
        <header class="top">

            <div class="first">

                <img
                    id="logo"
                    class="invert"
                    src="logo.svg"
                    alt="Spotify Logo"
                >

                <div class="search-box">

                    <img
                        id="home"
                        class="invert"
                        src="home.svg"
                        alt="Home"
                    >

                    <input
                        type="text"
                        placeholder="What do you want to play?"
                    >

                </div>

            </div>

            <div class="buttons">

                <button class="Signup">
                    Sign Up
                </button>

                <button class="login">
                    Log In
                </button>

            </div>

        </header>


        <!-- ================= MAIN CONTENT ================= -->
        <div class="cont">

            <!-- ================= SIDEBAR ================= -->
            <aside class="left">

                <div class="library-header">

                    <div>
                        <span class="library-title">Your Library</span>
                    </div>

                    <span class="library-add">+</span>

                </div>

                <div class="songlist">

                    <ul>
                    </ul>

                </div>

                <div class="sidebar-footer">

                    <span>Legal</span>
                    <span>Privacy</span>
                    <span>Cookies</span>

                </div>

            </aside>


            <!-- ================= CONTENT ================= -->
            <section class="right">

                <div class="content-area">

                    <div class="section-heading">

                        <div>
                            <p class="eyebrow">DISCOVER</p>
                            <h1>Made for you</h1>
                        </div>

                    </div>


                    <!-- ================= ALBUMS ================= -->
                    <div class="cards">

                        <div
                            data-folder="cs"
                            class="album-card"
                        >

                            <div class="album-image">

                                <img
                                    src="soft.webp"
                                    alt="Soft music"
                                >

                                <div class="album-play">
                                    <img
                                        src="play.svg"
                                        alt="Play"
                                        class="invert"
                                    >
                                </div>

                            </div>

                            <h2>Chill & Soul</h2>

                            <h4>
                                Relaxing and soulful tracks for
                                studying, working and unwinding.
                            </h4>

                        </div>


                        <div
                            data-folder="ncs"
                            class="album-card"
                        >

                            <div class="album-image">

                                <img
                                    src="hard.jpg"
                                    alt="Hard music"
                                >

                                <div class="album-play">
                                    <img
                                        src="play.svg"
                                        alt="Play"
                                        class="invert"
                                    >
                                </div>

                            </div>

                            <h2>Hard</h2>

                            <h4>
                                Energetic instrumental music for
                                intense moments and creative work.
                            </h4>

                        </div>

                    </div>

                </div>


                <!-- ================= PLAYER ================= -->
                <div class="side">

                    <div class="player-top">

                        <div class="now-playing-label">
                            NOW PLAYING
                        </div>

                    </div>


                    <div class="player-content">

                        <div class="player-art">

                            <div id="disc">
                            </div>

                        </div>


                        <div class="infos">

                            <div class="songinfo">
                            </div>

                            <div class="songtime">
                            </div>

                        </div>


                        <!-- SEEK BAR -->
                        <div class="seekbar">

                            <div class="circle">
                            </div>

                        </div>


                        <!-- CONTROLS -->
                        <div class="buttons">

                            <div
                                id="previous"
                                class="previous"
                            >
                                <img
                                    class="invert"
                                    src="previous.svg"
                                    alt="Previous"
                                >
                            </div>


                            <div id="minus5sec">

                                <img
                                    class="invert"
                                    src="minus5sec.svg"
                                    alt="Minus 5 Seconds"
                                >

                            </div>


                            <div
                                id="play"
                                class="play"
                            >
                                <img
                                    class="invert"
                                    src="play.svg"
                                    alt="Play"
                                >
                            </div>


                            <div id="plus5sec">

                                <img
                                    class="invert"
                                    src="plus5sec.svg"
                                    alt="Plus 5 Seconds"
                                >

                            </div>


                            <div
                                id="next"
                                class="next"
                            >
                                <img
                                    class="invert"
                                    src="next.svg"
                                    alt="Next"
                                >
                            </div>

                        </div>


                        <!-- VOLUME -->
                        <div id="voulme">

                            <span>VOL</span>

                            <input
                                type="range"
                                min="0"
                                max="100"
                                value="100"
                            >

                        </div>

                    </div>

                </div>

            </section>

        </div>

    </main>

</body>

<script src="Script.js"></script>

</html>
